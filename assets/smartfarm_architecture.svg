<svg width="1200" height="520" viewBox="0 0 1200 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SmartFarm IoT and AI architecture">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="520">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#58a6ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3fb950"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a371f7"/>
    </marker>
    <style>
      .title{font:700 28px -apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;fill:#f0f6fc}
      .subtitle{font:500 13.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;fill:#8b949e}
      .nodeTitle{font:700 18px -apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif}
      .nodeSub{font:500 12.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;fill:#b1bac4}
      .edgeLabel{font:700 10.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;letter-spacing:.25px}
      .foot{font:600 11px -apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;fill:#7d8590}
      .data{stroke:#58a6ff;stroke-width:2.6;fill:none;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowBlue)}
      .realtime{stroke:#3fb950;stroke-width:2.6;fill:none;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowGreen)}
      .control{stroke:#a371f7;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:7 8;marker-end:url(#arrowPurple)}
      .branch{stroke:#6e7681;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .scan{stroke-dasharray:20 210;animation:scan 4.8s linear infinite}
      .pulse{animation:pulse 2.6s ease-in-out infinite}
      @keyframes scan{to{stroke-dashoffset:-230}}
      @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
    </style>
  </defs>

  <rect width="1200" height="520" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="518" rx="23" fill="none" stroke="#21262d"/>

  <text x="48" y="48" class="title">SmartFarm IoT &amp; AI Architecture</text>
  <text x="48" y="74" class="subtitle">Telemetry → messaging → backend orchestration → persistence / automation / AI → realtime dashboard</text>

  <!-- top-layer cards -->
  <g>
    <rect x="48" y="118" width="200" height="104" rx="16" fill="#161b22" stroke="#8957e5" stroke-width="1.5"/>
    <circle cx="68" cy="138" r="4" fill="#a371f7" class="pulse"/>
    <text x="148" y="153" text-anchor="middle" class="nodeTitle" fill="#d2a8ff">ESP32 + Sensors</text>
    <text x="148" y="180" text-anchor="middle" class="nodeSub">Temperature · Humidity · Gas</text>
    <text x="148" y="200" text-anchor="middle" class="nodeSub">Water · Fire · Soil</text>

    <rect x="302" y="118" width="190" height="104" rx="16" fill="#161b22" stroke="#1f6feb" stroke-width="1.5"/>
    <circle cx="322" cy="138" r="4" fill="#58a6ff" class="pulse"/>
    <text x="397" y="153" text-anchor="middle" class="nodeTitle" fill="#79c0ff">MQTT Broker</text>
    <text x="397" y="180" text-anchor="middle" class="nodeSub">HiveMQ · Topics</text>
    <text x="397" y="200" text-anchor="middle" class="nodeSub">Telemetry · Commands · ACK</text>

    <rect x="552" y="108" width="236" height="124" rx="18" fill="#161b22" stroke="#238636" stroke-width="1.6"/>
    <circle cx="573" cy="129" r="4" fill="#3fb950" class="pulse"/>
    <text x="670" y="146" text-anchor="middle" class="nodeTitle" fill="#56d364">Backend Services</text>
    <text x="670" y="174" text-anchor="middle" class="nodeSub">Node.js · Express · JWT</text>
    <text x="670" y="194" text-anchor="middle" class="nodeSub">Device Control · Validation</text>
    <text x="670" y="214" text-anchor="middle" class="nodeSub">Timeout · Logging · Realtime</text>

    <rect x="936" y="108" width="216" height="124" rx="18" fill="#161b22" stroke="#1f6feb" stroke-width="1.6"/>
    <circle cx="957" cy="129" r="4" fill="#58a6ff" class="pulse"/>
    <text x="1044" y="146" text-anchor="middle" class="nodeTitle" fill="#79c0ff">React Dashboard</text>
    <text x="1044" y="174" text-anchor="middle" class="nodeSub">Realtime Monitoring</text>
    <text x="1044" y="194" text-anchor="middle" class="nodeSub">Charts · Alerts · Control UI</text>
    <text x="1044" y="214" text-anchor="middle" class="nodeSub">Socket.io Updates</text>
  </g>

  <!-- primary data flow: dedicated row at y170 -->
  <path d="M248 170 H302" class="data"/>
  <path d="M492 170 H552" class="data"/>
  <path d="M788 170 H936" class="realtime"/>

  <!-- edge labels, entirely inside gaps -->
  <g>
    <rect x="252" y="137" width="46" height="20" rx="10" fill="#0d1117" stroke="#1f6feb"/>
    <text x="275" y="151" text-anchor="middle" class="edgeLabel" fill="#79c0ff">DATA</text>

    <rect x="497" y="137" width="50" height="20" rx="10" fill="#0d1117" stroke="#238636"/>
    <text x="522" y="151" text-anchor="middle" class="edgeLabel" fill="#56d364">INGEST</text>

    <rect x="825" y="137" width="72" height="20" rx="10" fill="#0d1117" stroke="#238636"/>
    <text x="861" y="151" text-anchor="middle" class="edgeLabel" fill="#56d364">REALTIME</text>
  </g>

  <!-- control / acknowledgement flow on its own lane -->
  <path d="M1044 232 V264 H148 V222" class="control"/>
  <rect x="492" y="250" width="220" height="26" rx="13" fill="#0d1117" stroke="#8957e5"/>
  <text x="602" y="268" text-anchor="middle" class="edgeLabel" fill="#d2a8ff">COMMANDS  ←  CONTROL / ACK PATH</text>

  <!-- backend service fan-out bus -->
  <path d="M670 232 V305" class="branch"/>
  <path d="M530 305 H960" class="branch"/>
  <path d="M530 305 V344" class="branch"/>
  <path d="M745 305 V344" class="branch"/>
  <path d="M960 305 V344" class="branch"/>

  <circle cx="670" cy="305" r="4" fill="#8b949e"/>
  <circle cx="530" cy="305" r="3.5" fill="#58a6ff"/>
  <circle cx="745" cy="305" r="3.5" fill="#3fb950"/>
  <circle cx="960" cy="305" r="3.5" fill="#a371f7"/>

  <!-- lower service cards -->
  <g>
    <rect x="438" y="344" width="184" height="108" rx="16" fill="#161b22" stroke="#1f6feb" stroke-width="1.4"/>
    <text x="530" y="380" text-anchor="middle" class="nodeTitle" fill="#79c0ff">Database</text>
    <text x="530" y="407" text-anchor="middle" class="nodeSub">Supabase</text>
    <text x="530" y="428" text-anchor="middle" class="nodeSub">Sensor Data · Logs</text>

    <rect x="653" y="344" width="184" height="108" rx="16" fill="#161b22" stroke="#238636" stroke-width="1.4"/>
    <text x="745" y="380" text-anchor="middle" class="nodeTitle" fill="#56d364">Automation</text>
    <text x="745" y="407" text-anchor="middle" class="nodeSub">Threshold Rules</text>
    <text x="745" y="428" text-anchor="middle" class="nodeSub">Auto Control Logic</text>

    <rect x="868" y="344" width="184" height="108" rx="16" fill="#161b22" stroke="#8957e5" stroke-width="1.4"/>
    <text x="960" y="380" text-anchor="middle" class="nodeTitle" fill="#d2a8ff">AI Analyst</text>
    <text x="960" y="407" text-anchor="middle" class="nodeSub">Groq · Insights</text>
    <text x="960" y="428" text-anchor="middle" class="nodeSub">Daily Recommendations</text>
  </g>

  <!-- subtle animated packets -->
  <circle r="4.5" fill="#58a6ff" filter="url(#softGlow)">
    <animateMotion dur="3.8s" repeatCount="indefinite" path="M248 170 H552"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="3.8s" repeatCount="indefinite"/>
  </circle>
  <circle r="4.5" fill="#3fb950" filter="url(#softGlow)">
    <animateMotion dur="3.2s" begin=".5s" repeatCount="indefinite" path="M788 170 H936"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle r="4.3" fill="#a371f7" filter="url(#softGlow)">
    <animateMotion dur="6s" repeatCount="indefinite" path="M1044 232 V264 H148 V222"/>
    <animate attributeName="opacity" values="0;0;1;1;0" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle r="4.2" fill="#58a6ff" filter="url(#softGlow)">
    <animateMotion dur="4.8s" repeatCount="indefinite" path="M670 232 V305 H530 V344"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="4.8s" repeatCount="indefinite"/>
  </circle>
  <circle r="4.2" fill="#3fb950" filter="url(#softGlow)">
    <animateMotion dur="4.8s" begin="1.1s" repeatCount="indefinite" path="M670 232 V305 H745 V344"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="4.8s" repeatCount="indefinite"/>
  </circle>
  <circle r="4.2" fill="#a371f7" filter="url(#softGlow)">
    <animateMotion dur="4.8s" begin="2.1s" repeatCount="indefinite" path="M670 232 V305 H960 V344"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="4.8s" repeatCount="indefinite"/>
  </circle>

  <!-- restrained scan accents -->
  <path d="M571 109 H770" stroke="#3fb950" stroke-width="1.2" opacity=".8" class="scan"/>
  <path d="M954 109 H1134" stroke="#58a6ff" stroke-width="1.2" opacity=".75" class="scan" style="animation-delay:1.2s"/>

  <text x="48" y="488" class="foot">DATA = telemetry / ingest · CONTROL = operator commands + device acknowledgements · lower bus = backend persistence and decision services</text>
</svg>
