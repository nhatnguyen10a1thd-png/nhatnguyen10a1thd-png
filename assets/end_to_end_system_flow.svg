<svg width="1200" height="420" viewBox="0 0 1200 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="End-to-end systems flow">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="420">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#101827"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .title { font: 800 30px 'Segoe UI', Inter, Arial, sans-serif; fill: #e5eef8; }
      .subtitle { font: 500 14px 'Segoe UI', Inter, Arial, sans-serif; fill: #93a4b8; }
      .node-title { font: 800 18px 'Segoe UI', Inter, Arial, sans-serif; }
      .node-sub { font: 600 12px 'Segoe UI', Inter, Arial, sans-serif; fill: #d1d5db; }
      .cap { font: 700 12px 'Segoe UI', Inter, Arial, sans-serif; fill: #dbeafe; }
      .small { font: 700 11px 'Segoe UI', Inter, Arial, sans-serif; fill: #a5b4c7; }
      .line { stroke: #38bdf8; stroke-width: 3.2; fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 8 9; }
      .line2 { stroke: #a78bfa; stroke-width: 3.2; fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 8 9; }
    </style>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <text x="46" y="50" class="title">🧠 How I Think About End-to-End Systems</text>
  <text x="46" y="75" class="subtitle">From the physical world to software, data, intelligence, realtime APIs, and user-facing applications</text>

  <g filter="url(#glow)">
    <rect x="66" y="154" width="140" height="84" rx="20" fill="#23183a" stroke="#a78bfa" stroke-width="2.2"/>
    <text x="136" y="187" text-anchor="middle" class="node-title" fill="#e8dbff">🌍 Physical World</text>
    <text x="136" y="209" text-anchor="middle" class="node-sub">Real-world events</text>

    <rect x="248" y="154" width="160" height="84" rx="20" fill="#25163a" stroke="#c084fc" stroke-width="2.2"/>
    <text x="328" y="187" text-anchor="middle" class="node-title" fill="#eddcff">🌱 Sensors / ESP32</text>
    <text x="328" y="209" text-anchor="middle" class="node-sub">Capture data</text>

    <rect x="448" y="154" width="150" height="84" rx="20" fill="#0e2338" stroke="#38bdf8" stroke-width="2.2"/>
    <text x="523" y="187" text-anchor="middle" class="node-title" fill="#d7f0ff">📡 MQTT / HTTP</text>
    <text x="523" y="209" text-anchor="middle" class="node-sub">Transport & messaging</text>

    <rect x="642" y="154" width="175" height="84" rx="20" fill="#0b2b1e" stroke="#4ade80" stroke-width="2.2"/>
    <text x="729.5" y="187" text-anchor="middle" class="node-title" fill="#caf7db">⚙️ Backend Services</text>
    <text x="729.5" y="209" text-anchor="middle" class="node-sub">Logic · Validation · Auth</text>

    <rect x="860" y="154" width="145" height="84" rx="20" fill="#15243d" stroke="#60a5fa" stroke-width="2.2"/>
    <text x="932.5" y="187" text-anchor="middle" class="node-title" fill="#deebff">🗄️ Database</text>
    <text x="932.5" y="209" text-anchor="middle" class="node-sub">Persist data</text>

    <rect x="860" y="286" width="178" height="84" rx="20" fill="#25163a" stroke="#c084fc" stroke-width="2.2"/>
    <text x="949" y="319" text-anchor="middle" class="node-title" fill="#eddcff">🧠 AI / Data Processing</text>
    <text x="949" y="341" text-anchor="middle" class="node-sub">Analytics · Insights</text>

    <rect x="1046" y="154" width="120" height="84" rx="20" fill="#082f49" stroke="#22d3ee" stroke-width="2.2"/>
    <text x="1106" y="187" text-anchor="middle" class="node-title" fill="#dafaff">🔄 Realtime APIs</text>
    <text x="1106" y="209" text-anchor="middle" class="node-sub">Live updates</text>

    <rect x="1046" y="286" width="120" height="84" rx="20" fill="#0c4a6e" stroke="#38bdf8" stroke-width="2.2"/>
    <text x="1106" y="319" text-anchor="middle" class="node-title" fill="#d7f9ff">🖥️ Web App</text>
    <text x="1106" y="341" text-anchor="middle" class="node-sub">Dashboard / UI</text>
  </g>

  <path d="M206 196 H248" class="line2"/>
  <path d="M408 196 H448" class="line2"/>
  <path d="M598 196 H642" class="line"/>
  <path d="M817 196 H860" class="line"/>
  <path d="M1005 196 H1046" class="line"/>
  <path d="M1106 238 V286" class="line"/>
  <path d="M932.5 238 V272" class="line2"/>
  <path d="M1005 196 C1028 196,1036 196,1046 196" class="line"/>

  <path d="M932.5 238 V262 H949 V286" class="line2"/>

  <rect x="709" y="102" width="110" height="28" rx="14" fill="#10283d" stroke="#38bdf8"/>
  <text x="764" y="120" text-anchor="middle" class="cap">Core Logic</text>

  <rect x="893" y="102" width="78" height="28" rx="14" fill="#1d1f3a" stroke="#a78bfa"/>
  <text x="932" y="120" text-anchor="middle" class="cap">Data</text>

  <circle r="6" fill="#a78bfa" filter="url(#glow)">
    <animateMotion dur="4.2s" repeatCount="indefinite" path="M206 196 H248 H448 H642"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="4.2s" repeatCount="indefinite"/>
  </circle>

  <circle r="6" fill="#38bdf8" filter="url(#glow)">
    <animateMotion dur="4.8s" begin=".6s" repeatCount="indefinite" path="M642 196 H860 H1046 V286"/>
    <animate attributeName="opacity" values="0;1;1;1;0" dur="4.8s" repeatCount="indefinite"/>
  </circle>

  <circle r="6" fill="#c084fc" filter="url(#glow)">
    <animateMotion dur="3.6s" begin="1.2s" repeatCount="indefinite" path="M932.5 238 V262 H949 V286"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="3.6s" repeatCount="indefinite"/>
  </circle>

  <text x="48" y="394" class="small">Recommended use: replace the plain ASCII "Physical World → User" diagram in your GitHub profile README.</text>
</svg>