<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="410">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="accent3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="410" rx="28" fill="url(#bg)"/>
  <text x="48" y="48" fill="#f8fafc" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="700">How I Think About End-to-End Systems</text>
  <text x="48" y="74" fill="#94a3b8" font-family="Segoe UI,Arial,sans-serif" font-size="14">
    From physical signals to software, data, intelligence, realtime APIs, and user-facing applications
  </text>

  <!-- Physical world -->
  <rect x="50" y="145" width="145" height="86" rx="18" fill="#1f1634" stroke="#a78bfa" stroke-width="2"/>
  <circle cx="78" cy="173" r="12" fill="url(#accent2)"/>
  <text x="98" y="178" fill="#ede9fe" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700">Physical World</text>
  <text x="72" y="207" fill="#c4b5fd" font-family="Segoe UI,Arial,sans-serif" font-size="12">Real-world events</text>

  <!-- Sensors -->
  <rect x="235" y="145" width="155" height="86" rx="18" fill="#22153a" stroke="#c084fc" stroke-width="2"/>
  <circle cx="263" cy="173" r="12" fill="url(#accent2)"/>
  <text x="283" y="178" fill="#f3e8ff" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700">Sensors / ESP32</text>
  <text x="257" y="207" fill="#d8b4fe" font-family="Segoe UI,Arial,sans-serif" font-size="12">Capture telemetry</text>

  <!-- Messaging -->
  <rect x="430" y="145" width="145" height="86" rx="18" fill="#0d2238" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="458" cy="173" r="12" fill="url(#accent1)"/>
  <text x="478" y="178" fill="#e0f2fe" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700">MQTT / HTTP</text>
  <text x="452" y="207" fill="#bae6fd" font-family="Segoe UI,Arial,sans-serif" font-size="12">Messaging layer</text>

  <!-- Backend -->
  <rect x="615" y="135" width="175" height="106" rx="20" fill="#0b2b1e" stroke="#4ade80" stroke-width="2"/>
  <circle cx="645" cy="166" r="12" fill="url(#accent3)"/>
  <text x="667" y="172" fill="#dcfce7" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700">Backend Services</text>
  <text x="639" y="200" fill="#bbf7d0" font-family="Segoe UI,Arial,sans-serif" font-size="12">Logic - Validation - Auth</text>
  <text x="639" y="219" fill="#bbf7d0" font-family="Segoe UI,Arial,sans-serif" font-size="12">APIs - Business Rules</text>

  <!-- Database -->
  <rect x="835" y="145" width="135" height="86" rx="18" fill="#15243d" stroke="#60a5fa" stroke-width="2"/>
  <circle cx="863" cy="173" r="12" fill="url(#accent1)"/>
  <text x="883" y="178" fill="#dbeafe" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700">Database</text>
  <text x="857" y="207" fill="#bfdbfe" font-family="Segoe UI,Arial,sans-serif" font-size="12">Persist state</text>

  <!-- Realtime -->
  <rect x="1010" y="145" width="140" height="86" rx="18" fill="#082f49" stroke="#22d3ee" stroke-width="2"/>
  <circle cx="1038" cy="173" r="12" fill="#22d3ee"/>
  <text x="1058" y="178" fill="#cffafe" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700">Realtime APIs</text>
  <text x="1032" y="207" fill="#a5f3fc" font-family="Segoe UI,Arial,sans-serif" font-size="12">Live updates</text>

  <!-- AI -->
  <rect x="820" y="287" width="170" height="82" rx="18" fill="#23153a" stroke="#c084fc" stroke-width="2"/>
  <circle cx="848" cy="315" r="12" fill="url(#accent2)"/>
  <text x="868" y="320" fill="#f3e8ff" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700">AI / Data Processing</text>
  <text x="842" y="347" fill="#d8b4fe" font-family="Segoe UI,Arial,sans-serif" font-size="12">Analysis - Search - Insights</text>

  <!-- Web app -->
  <rect x="1010" y="287" width="140" height="82" rx="18" fill="#0c4a6e" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="1038" cy="315" r="12" fill="url(#accent1)"/>
  <text x="1058" y="320" fill="#e0f2fe" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700">Web App</text>
  <text x="1032" y="347" fill="#bae6fd" font-family="Segoe UI,Arial,sans-serif" font-size="12">User experience</text>

  <!-- Connections -->
  <path d="M195 188 H235" stroke="#a78bfa" stroke-width="3" fill="none"/>
  <path d="M390 188 H430" stroke="#a78bfa" stroke-width="3" fill="none"/>
  <path d="M575 188 H615" stroke="#38bdf8" stroke-width="3" fill="none"/>
  <path d="M790 188 H835" stroke="#4ade80" stroke-width="3" fill="none"/>
  <path d="M970 188 H1010" stroke="#38bdf8" stroke-width="3" fill="none"/>
  <path d="M1080 231 V287" stroke="#38bdf8" stroke-width="3" fill="none"/>
  <path d="M902 231 V287" stroke="#a78bfa" stroke-width="3" fill="none"/>

  <!-- Arrow heads -->
  <polygon points="235,188 224,182 224,194" fill="#a78bfa"/>
  <polygon points="430,188 419,182 419,194" fill="#a78bfa"/>
  <polygon points="615,188 604,182 604,194" fill="#38bdf8"/>
  <polygon points="835,188 824,182 824,194" fill="#4ade80"/>
  <polygon points="1010,188 999,182 999,194" fill="#38bdf8"/>
  <polygon points="1080,287 1074,276 1086,276" fill="#38bdf8"/>
  <polygon points="902,287 896,276 908,276" fill="#a78bfa"/>

  <text x="48" y="391" fill="#64748b" font-family="Segoe UI,Arial,sans-serif" font-size="11">
    Device - Messaging - Backend - Data - Intelligence - Realtime - User Experience
  </text>
</svg>