<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">My Engineering Direction</title>
  <desc id="desc">Backend, Artificial Intelligence, and Embedded / IoT converging into end-to-end systems.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#11161d"/>
    </linearGradient>
    <linearGradient id="headerRule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff" stop-opacity=".8"/>
      <stop offset=".48" stop-color="#a371f7" stop-opacity=".55"/>
      <stop offset="1" stop-color="#3fb950" stop-opacity=".8"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset=".5" stop-color="#8b949e"/>
      <stop offset="1" stop-color="#3fb950"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#30363d" stroke-width="1" opacity=".16"/>
    </pattern>
    <style>
      .ui { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; }
      .mono { font-family: ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace; }
      .title { font-size: 30px; font-weight: 700; fill: #f0f6fc; letter-spacing: -.35px; }
      .subtitle { font-size: 14px; font-weight: 400; fill: #8b949e; }
      .eyebrow { font-size: 11px; font-weight: 700; fill: #8b949e; letter-spacing: 1.4px; }
      .nodeTitle { font-size: 17px; font-weight: 700; fill: #f0f6fc; }
      .nodeSub { font-size: 11px; font-weight: 700; letter-spacing: 1.15px; }
      .body { font-size: 13px; font-weight: 500; fill: #c9d1d9; }
      .meta { font-size: 11px; fill: #6e7681; }
      .smallMono { font-size: 11px; fill: #8b949e; }
    </style>
  </defs>

  <rect width="1200" height="560" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="558" rx="23" fill="none" stroke="#30363d"/>
  <rect x="24" y="112" width="1152" height="420" rx="18" fill="url(#grid)" opacity=".7"/>

  <!-- header -->
  <g class="ui">
    <text x="48" y="52" class="title">My Engineering Direction</text>
    <text x="48" y="78" class="subtitle">Three disciplines, one goal: understand and build the complete system.</text>
    <rect x="985" y="37" width="167" height="30" rx="15" fill="#161b22" stroke="#30363d"/>
    <circle cx="1005" cy="52" r="4" fill="#3fb950">
      <animate attributeName="opacity" values=".45;1;.45" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <text x="1017" y="56" class="eyebrow">ENGINEERING MAP</text>
    <line x1="48" y1="98" x2="1152" y2="98" stroke="#21262d"/>
    <line x1="48" y1="98" x2="284" y2="98" stroke="url(#headerRule)" stroke-width="2"/>
  </g>

  <!-- core mindset -->
  <g class="ui">
    <rect x="420" y="126" width="360" height="72" rx="14" fill="#161b22" stroke="#30363d"/>
    <rect x="420" y="126" width="5" height="72" rx="2.5" fill="#58a6ff"/>
    <rect x="437" y="141" width="74" height="22" rx="11" fill="#0d1117" stroke="#30363d"/>
    <text x="474" y="156" text-anchor="middle" class="mono eyebrow" fill="#58a6ff">CORE</text>
    <text x="437" y="184" class="nodeTitle">Computer Engineering Mindset</text>
    <path d="M427 128 H774" fill="none" stroke="#58a6ff" stroke-width="1.2" stroke-dasharray="42 230" opacity=".8">
      <animate attributeName="stroke-dashoffset" from="0" to="-272" dur="5.5s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- split connectors -->
  <g fill="none" stroke="#484f58" stroke-width="1.6">
    <path d="M600 198V226H240V246"/>
    <path d="M600 198V246"/>
    <path d="M600 226H960V246"/>
  </g>
  <g fill="#8b949e">
    <circle cx="240" cy="246" r="3"/><circle cx="600" cy="246" r="3"/><circle cx="960" cy="246" r="3"/>
  </g>

  <!-- backend -->
  <g class="ui">
    <rect x="72" y="246" width="336" height="190" rx="16" fill="#161b22" stroke="#30363d"/>
    <rect x="72" y="246" width="4" height="190" rx="2" fill="#58a6ff"/>
    <text x="98" y="278" class="mono eyebrow" fill="#58a6ff">01 / BACKEND</text>
    <text x="98" y="309" class="nodeTitle">Software Foundation</text>
    <text x="98" y="337" class="body">Java · Spring Boot · Node.js</text>
    <text x="98" y="362" class="body">REST · GraphQL · SQL / JPA</text>
    <text x="98" y="387" class="body">Security · transactions · architecture</text>
    <rect x="98" y="406" width="122" height="20" rx="10" fill="#0d1117" stroke="#30363d"/>
    <text x="159" y="420" text-anchor="middle" class="mono smallMono">SERVICES + DATA</text>
    <circle cx="382" cy="272" r="5" fill="#58a6ff">
      <animate attributeName="r" values="4;6;4" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".55;1;.55" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ai -->
  <g class="ui">
    <rect x="432" y="246" width="336" height="190" rx="16" fill="#161b22" stroke="#30363d"/>
    <rect x="432" y="246" width="4" height="190" rx="2" fill="#a371f7"/>
    <text x="458" y="278" class="mono eyebrow" fill="#a371f7">02 / AI</text>
    <text x="458" y="309" class="nodeTitle">Intelligence Layer</text>
    <text x="458" y="337" class="body">Computer vision · retrieval</text>
    <text x="458" y="362" class="body">Search · ranking · evaluation</text>
    <text x="458" y="387" class="body">PyTorch · CLIP · FAISS</text>
    <rect x="458" y="406" width="129" height="20" rx="10" fill="#0d1117" stroke="#30363d"/>
    <text x="522.5" y="420" text-anchor="middle" class="mono smallMono">MODELS + SIGNALS</text>
    <circle cx="742" cy="272" r="5" fill="#a371f7">
      <animate attributeName="r" values="4;6;4" dur="3.6s" begin=".8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".55;1;.55" dur="3.6s" begin=".8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- embedded -->
  <g class="ui">
    <rect x="792" y="246" width="336" height="190" rx="16" fill="#161b22" stroke="#30363d"/>
    <rect x="792" y="246" width="4" height="190" rx="2" fill="#3fb950"/>
    <text x="818" y="278" class="mono eyebrow" fill="#3fb950">03 / EMBEDDED + IoT</text>
    <text x="818" y="309" class="nodeTitle">Physical Integration</text>
    <text x="818" y="337" class="body">C++ · ESP32 · sensors</text>
    <text x="818" y="362" class="body">MQTT · telemetry · realtime control</text>
    <text x="818" y="387" class="body">Automation · hardware ↔ cloud</text>
    <rect x="818" y="406" width="132" height="20" rx="10" fill="#0d1117" stroke="#30363d"/>
    <text x="884" y="420" text-anchor="middle" class="mono smallMono">DEVICE + CLOUD</text>
    <circle cx="1102" cy="272" r="5" fill="#3fb950">
      <animate attributeName="r" values="4;6;4" dur="3.6s" begin="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".55;1;.55" dur="3.6s" begin="1.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- convergence -->
  <g fill="none" stroke="#484f58" stroke-width="1.6">
    <path d="M240 436V466H600"/>
    <path d="M600 436V466"/>
    <path d="M960 436V466H600"/>
  </g>
  <circle r="4.5" fill="#58a6ff">
    <animateMotion dur="4.8s" repeatCount="indefinite" path="M240 436V466H600"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="4.8s" repeatCount="indefinite"/>
  </circle>
  <circle r="4.5" fill="#a371f7">
    <animateMotion dur="4.8s" begin="1.15s" repeatCount="indefinite" path="M600 436V466"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="4.8s" begin="1.15s" repeatCount="indefinite"/>
  </circle>
  <circle r="4.5" fill="#3fb950">
    <animateMotion dur="4.8s" begin="2.3s" repeatCount="indefinite" path="M960 436V466H600"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="4.8s" begin="2.3s" repeatCount="indefinite"/>
  </circle>

  <!-- final node -->
  <g class="ui">
    <rect x="430" y="466" width="340" height="48" rx="14" fill="#161b22" stroke="#30363d"/>
    <line x1="444" y1="466" x2="756" y2="466" stroke="url(#flow)" stroke-width="2"/>
    <text x="600" y="496" text-anchor="middle" class="nodeTitle">End-to-End Systems</text>
  </g>

  <!-- tiny footer -->
  <text x="48" y="540" class="mono meta">foundation → intelligence → physical integration → complete system</text>
  <text x="1152" y="540" text-anchor="end" class="mono meta">build / observe / reason / improve</text>
</svg>
