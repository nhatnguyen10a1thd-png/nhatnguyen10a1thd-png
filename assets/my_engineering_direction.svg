<svg width="1200" height="470" viewBox="0 0 1200 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="My engineering direction">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1200" y2="470">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .title { font: 800 30px 'Segoe UI', Inter, Arial, sans-serif; fill: #e5eef8; }
      .subtitle { font: 500 14px 'Segoe UI', Inter, Arial, sans-serif; fill: #93a4b8; }
      .mid { font: 800 21px 'Segoe UI', Inter, Arial, sans-serif; fill: #f8fafc; letter-spacing: .4px; }
      .node-title { font: 800 22px 'Segoe UI', Inter, Arial, sans-serif; }
      .bullet { font: 700 16px 'Segoe UI', Inter, Arial, sans-serif; }
      .cap { font: 800 14px 'Segoe UI', Inter, Arial, sans-serif; fill: #dbeafe; }
      .small { font: 700 11px 'Segoe UI', Inter, Arial, sans-serif; fill: #a5b4c7; }
      .lineB { stroke: #38bdf8; stroke-width: 3.3; fill: none; stroke-linecap: round; stroke-linejoin: round; opacity: .95; }
      .lineP { stroke: #a78bfa; stroke-width: 3.3; fill: none; stroke-linecap: round; stroke-linejoin: round; opacity: .95; }
      .lineG { stroke: #4ade80; stroke-width: 3.3; fill: none; stroke-linecap: round; stroke-linejoin: round; opacity: .95; }
    </style>
  </defs>

  <rect width="1200" height="470" rx="28" fill="url(#bg2)"/>
  <text x="46" y="50" class="title">🧭 My Engineering Direction</text>
  <text x="46" y="75" class="subtitle">A balanced direction across backend, artificial intelligence, and embedded / IoT — connected by end-to-end system thinking</text>

  <text x="600" y="122" text-anchor="middle" class="mid">COMPUTER ENGINEERING MINDSET</text>

  <path d="M600 138 V176" class="lineP"/>
  <path d="M270 176 H930" class="lineP"/>
  <path d="M270 176 V205" class="lineP"/>
  <path d="M600 176 V205" class="lineP"/>
  <path d="M930 176 V205" class="lineP"/>

  <g filter="url(#glow2)">
    <rect x="120" y="205" width="300" height="170" rx="24" fill="#0e2338" stroke="#38bdf8" stroke-width="2.3"/>
    <text x="270" y="245" text-anchor="middle" class="node-title" fill="#d9f2ff">🖥️ BACKEND</text>
    <text x="270" y="278" text-anchor="middle" class="bullet" fill="#e2f4ff">Java / Spring Boot</text>
    <text x="270" y="307" text-anchor="middle" class="bullet" fill="#e2f4ff">Node.js / Express</text>
    <text x="270" y="336" text-anchor="middle" class="bullet" fill="#e2f4ff">REST / GraphQL / SQL</text>
    <text x="270" y="365" text-anchor="middle" class="bullet" fill="#e2f4ff">Security / Architecture</text>

    <rect x="450" y="205" width="300" height="170" rx="24" fill="#24163a" stroke="#a78bfa" stroke-width="2.3"/>
    <text x="600" y="245" text-anchor="middle" class="node-title" fill="#eddcff">🤖 AI</text>
    <text x="600" y="278" text-anchor="middle" class="bullet" fill="#f4ebff">Python / Computer Vision</text>
    <text x="600" y="307" text-anchor="middle" class="bullet" fill="#f4ebff">Retrieval / Search / Ranking</text>
    <text x="600" y="336" text-anchor="middle" class="bullet" fill="#f4ebff">PyTorch / CLIP / FAISS</text>
    <text x="600" y="365" text-anchor="middle" class="bullet" fill="#f4ebff">Evaluation / Experimentation</text>

    <rect x="780" y="205" width="300" height="170" rx="24" fill="#0b2b1e" stroke="#4ade80" stroke-width="2.3"/>
    <text x="930" y="245" text-anchor="middle" class="node-title" fill="#caf7db">🔌 EMBEDDED / IoT</text>
    <text x="930" y="278" text-anchor="middle" class="bullet" fill="#ddfce8">C++ / ESP32</text>
    <text x="930" y="307" text-anchor="middle" class="bullet" fill="#ddfce8">MQTT / Sensors / Telemetry</text>
    <text x="930" y="336" text-anchor="middle" class="bullet" fill="#ddfce8">Automation / Realtime</text>
    <text x="930" y="365" text-anchor="middle" class="bullet" fill="#ddfce8">Hardware ↔ Cloud Systems</text>
  </g>

  <path d="M270 375 V404 H930 V404" class="lineP" opacity=".75"/>
  <path d="M600 375 V426" class="lineP"/>
  <text x="600" y="454" text-anchor="middle" class="mid" fill="#dbeafe">END-TO-END SYSTEMS</text>

  <circle r="6" fill="#38bdf8" filter="url(#glow2)">
    <animateMotion dur="5s" repeatCount="indefinite" path="M270 176 V205"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle r="6" fill="#a78bfa" filter="url(#glow2)">
    <animateMotion dur="5s" begin="1.2s" repeatCount="indefinite" path="M600 176 V205"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle r="6" fill="#4ade80" filter="url(#glow2)">
    <animateMotion dur="5s" begin="2.2s" repeatCount="indefinite" path="M930 176 V205"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="5s" repeatCount="indefinite"/>
  </circle>

  <text x="48" y="442" class="small">Recommended use: replace the plain ASCII "My Engineering Direction" diagram to match the premium style of the rest of your README.</text>
</svg>