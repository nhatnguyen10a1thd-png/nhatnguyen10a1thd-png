<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="470">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="470" rx="28" fill="url(#bg)"/>
  <text x="48" y="48" fill="#f8fafc" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="700">My Engineering Direction</text>
  <text x="48" y="74" fill="#94a3b8" font-family="Segoe UI,Arial,sans-serif" font-size="14">
    Backend, Artificial Intelligence, and Embedded / IoT connected by end-to-end system thinking
  </text>

  <!-- Central mindset -->
  <rect x="445" y="102" width="310" height="58" rx="29" fill="#161d2c" stroke="#64748b" stroke-width="2"/>
  <text x="600" y="137" text-anchor="middle" fill="#f8fafc" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="700">
    COMPUTER ENGINEERING MINDSET
  </text>

  <!-- Split lines -->
  <path d="M600 160 V186 H245 V208" stroke="#64748b" stroke-width="2.5" fill="none"/>
  <path d="M600 186 V208" stroke="#64748b" stroke-width="2.5" fill="none"/>
  <path d="M600 186 H955 V208" stroke="#64748b" stroke-width="2.5" fill="none"/>

  <!-- Backend card -->
  <rect x="90" y="208" width="310" height="176" rx="24" fill="#0d2238" stroke="#38bdf8" stroke-width="2"/>
  <rect x="90" y="208" width="310" height="8" rx="4" fill="url(#blue)"/>
  <circle cx="130" cy="254" r="18" fill="url(#blue)"/>
  <text x="160" y="261" fill="#e0f2fe" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700">BACKEND</text>
  <text x="124" y="301" fill="#e0f2fe" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="600">Java / Spring Boot</text>
  <text x="124" y="327" fill="#e0f2fe" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="600">Node.js / Express</text>
  <text x="124" y="353" fill="#e0f2fe" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="600">REST / GraphQL / SQL</text>
  <text x="124" y="379" fill="#e0f2fe" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="600">Security / Architecture</text>

  <!-- AI card -->
  <rect x="445" y="208" width="310" height="176" rx="24" fill="#23153a" stroke="#a78bfa" stroke-width="2"/>
  <rect x="445" y="208" width="310" height="8" rx="4" fill="url(#purple)"/>
  <circle cx="485" cy="254" r="18" fill="url(#purple)"/>
  <text x="515" y="261" fill="#f3e8ff" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700">ARTIFICIAL INTELLIGENCE</text>
  <text x="479" y="301" fill="#f3e8ff" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="600">Python / Computer Vision</text>
  <text x="479" y="327" fill="#f3e8ff" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="600">Retrieval / Search / Ranking</text>
  <text x="479" y="353" fill="#f3e8ff" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="600">PyTorch / CLIP / FAISS</text>
  <text x="479" y="379" fill="#f3e8ff" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="600">Evaluation / Experimentation</text>

  <!-- Embedded card -->
  <rect x="800" y="208" width="310" height="176" rx="24" fill="#0b2b1e" stroke="#4ade80" stroke-width="2"/>
  <rect x="800" y="208" width="310" height="8" rx="4" fill="url(#green)"/>
  <circle cx="840" cy="254" r="18" fill="url(#green)"/>
  <text x="870" y="261" fill="#dcfce7" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700">EMBEDDED / IoT</text>
  <text x="834" y="301" fill="#dcfce7" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="600">C++ / ESP32</text>
  <text x="834" y="327" fill="#dcfce7" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="600">MQTT / Sensors / Telemetry</text>
  <text x="834" y="353" fill="#dcfce7" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="600">Automation / Realtime</text>
  <text x="834" y="379" fill="#dcfce7" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="600">Hardware to Cloud Systems</text>

  <!-- Merge to end-to-end -->
  <path d="M245 384 V410 H600" stroke="#38bdf8" stroke-width="2.5" fill="none"/>
  <path d="M600 384 V424" stroke="#a78bfa" stroke-width="2.5" fill="none"/>
  <path d="M955 384 V410 H600" stroke="#4ade80" stroke-width="2.5" fill="none"/>
  <polygon points="600,430 594,418 606,418" fill="#a78bfa"/>

  <rect x="475" y="428" width="250" height="30" rx="15" fill="#161d2c" stroke="#64748b"/>
  <text x="600" y="448" text-anchor="middle" fill="#e2e8f0" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700">
    END-TO-END SYSTEMS
  </text>
</svg>